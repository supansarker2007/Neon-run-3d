<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Neon Run 3D</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050816;font-family:system-ui,Arial;color:#fff;touch-action:none}
#game{position:fixed;inset:0}canvas{display:block}
#hud{position:fixed;inset:0;pointer-events:none;padding:16px;display:flex;justify-content:space-between;align-items:flex-start;text-shadow:0 2px 8px #000}
.pill{background:#07152dcc;border:1px solid #42d9ff66;border-radius:14px;padding:9px 13px;font-weight:700;backdrop-filter:blur(8px)}
#help{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);text-align:center;font-size:12px;color:#d9f7ff;background:#06101dcc;padding:9px 14px;border-radius:14px;pointer-events:none;white-space:nowrap}
#overlay{position:fixed;inset:0;display:grid;place-items:center;background:linear-gradient(#02061799,#020617dd);padding:22px}
.panel{width:min(440px,100%);text-align:center;background:#08172beF;border:1px solid #39dfff77;border-radius:24px;padding:28px 22px;box-shadow:0 0 60px #00bfff22}
h1{margin:0 0 8px;font-size:clamp(32px,8vw,48px);letter-spacing:2px;color:#66e6ff}
p{color:#c6dce8;line-height:1.5}
button{border:0;border-radius:14px;padding:13px 22px;background:linear-gradient(120deg,#00b9e8,#635bff);color:white;font-weight:800;font-size:16px}
#controls{position:fixed;bottom:66px;left:0;right:0;display:flex;justify-content:space-between;padding:0 18px;pointer-events:none}
.pad{display:flex;gap:10px}.ctrl{pointer-events:auto;width:58px;height:58px;border-radius:18px;background:#0a234dcc;border:1px solid #65e8ff88;color:white;font-size:22px;display:grid;place-items:center;user-select:none}
@media (min-width:800px){#controls{display:none}}
</style>
</head>
<body>
<div id="game"></div>
<div id="hud"><div class="pill">⚡ NEON RUN 3D</div><div class="pill">Score: <span id="score">0</span> &nbsp; Best: <span id="best">0</span></div></div>
<div id="controls"><div class="pad"><div class="ctrl" id="left">◀</div><div class="ctrl" id="right">▶</div></div><div class="pad"><div class="ctrl" id="jump">⬆</div></div></div>
<div id="help">← → move · Space / ↑ jump · Mobile: tap controls or swipe</div>
<div id="overlay"><div class="panel"><h1>NEON RUN</h1><p>A tiny 3D endless runner. Dodge the glowing blocks, jump over barriers, and see how far you can go.</p><button id="start">START RUN</button></div></div>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
(()=>{
const root=document.getElementById('game'), scoreEl=document.getElementById('score'),bestEl=document.getElementById('best'),overlay=document.getElementById('overlay');
let scene,camera,renderer,player,clock,playing=false,score=0,speed=17,spawnT=0,vy=0,onGround=true,lane=0,objects=[],roadBits=[];
let best=Number(localStorage.getItem('neonrun-best')||0);bestEl.textContent=best;
const mat=(c,e=0)=>new THREE.MeshStandardMaterial({color:c,emissive:c,emissiveIntensity:e,roughness:.45});
function init(){
 scene=new THREE.Scene();scene.background=new THREE.Color(0x050816);scene.fog=new THREE.Fog(0x050816,25,105);
 camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,180);camera.position.set(0,5.2,9);camera.lookAt(0,1,-8);
 renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;root.appendChild(renderer.domElement);
 scene.add(new THREE.HemisphereLight(0x9bdcff,0x101020,2));
 const light=new THREE.DirectionalLight(0xffffff,2.2);light.position.set(-5,12,7);light.castShadow=true;scene.add(light);
 const floor=new THREE.Mesh(new THREE.PlaneGeometry(200,200),mat(0x081426));floor.rotation.x=-Math.PI/2;floor.position.y=-.08;floor.position.z=-35;floor.receiveShadow=true;scene.add(floor);
 const road=new THREE.Mesh(new THREE.BoxGeometry(9,.12,150),mat(0x111d33));road.position.set(0,-.02,-55);scene.add(road);
 for(let x of [-1.5,1.5]){let line=new THREE.Mesh(new THREE.BoxGeometry(.055,.025,150),mat(0x19cfff,.7));line.position.set(x,.06,-55);scene.add(line)}
 for(let i=0;i<32;i++){let z=8-i*5;for(let x of [-7,7]){let b=new THREE.Mesh(new THREE.BoxGeometry(.45,1.3,.45),mat(0x133b65));b.position.set(x,.65,z);scene.add(b);let cap=new THREE.Mesh(new THREE.BoxGeometry(.5,.08,.5),mat(0x00cfff,1.3));cap.position.set(x,1.34,z);scene.add(cap)}}
 player=new THREE.Group();const body=new THREE.Mesh(new THREE.BoxGeometry(.8,1.15,.55),mat(0x00c9ff,.65));body.position.y=.85;body.castShadow=true;player.add(body);
 const head=new THREE.Mesh(new THREE.SphereGeometry(.32,16,12),mat(0xe9f8ff,.2));head.position.y=1.62;player.add(head);
 const stripe=new THREE.Mesh(new THREE.BoxGeometry(.84,.12,.58),mat(0x7d5cff,1.4));stripe.position.y=1.02;player.add(stripe);
 player.position.z=2;scene.add(player);clock=new THREE.Clock();
}
function addObstacle(){
 const laneN=Math.floor(Math.random()*3)-1,type=Math.random()<.25?'barrier':'block',h=type==='barrier'?.65:1.8;
 const mesh=new THREE.Mesh(new THREE.BoxGeometry(type==='barrier'?1.55:1.15,h,.9),mat(type==='barrier'?0xffa52e:0xff315f,type==='barrier'?.8:1));
 mesh.position.set(laneN*2.3,h/2,-90);mesh.castShadow=true;scene.add(mesh);objects.push(mesh);
}
function moveLane(d){if(!playing)return;lane=Math.max(-1,Math.min(1,lane+d))}
function jump(){if(playing&&onGround){vy=9.5;onGround=false}}
function endGame(){playing=false;best=Math.max(best,Math.floor(score));localStorage.setItem('neonrun-best',best);bestEl.textContent=best;overlay.style.display='grid';overlay.querySelector('h1').textContent='RUN OVER';overlay.querySelector('p').textContent='Your score: '+Math.floor(score)+'. Ready for another run?';document.getElementById('start').textContent='TRY AGAIN'}
function reset(){objects.forEach(o=>scene.remove(o));objects=[];score=0;speed=17;spawnT=0;lane=0;vy=0;onGround=true;player.position.set(0,0,2);scoreEl.textContent='0';overlay.style.display='none';clock.start();playing=true}
function update(dt){
 if(!playing)return;
 score+=dt*10;speed=Math.min(29,17+score*.018);scoreEl.textContent=Math.floor(score);
 player.position.x+=(lane*2.3-player.position.x)*Math.min(1,dt*12);
 vy-=23*dt;player.position.y+=vy*dt;if(player.position.y<=0){player.position.y=0;vy=0;onGround=true}
 player.rotation.z=(lane*2.3-player.position.x)*-.07;
 spawnT-=dt;if(spawnT<=0){addObstacle();spawnT=Math.max(.48,1.05-score*.0015)}
 for(let i=objects.length-1;i>=0;i--){let o=objects[i];o.position.z+=speed*dt;o.rotation.y+=dt*.7;
 if(Math.abs(o.position.z-player.position.z)<.72&&Math.abs(o.position.x-player.position.x)<1.05){
   const barrier=o.geometry.parameters.height<1;
   if(barrier&&player.position.y>.55){}else{endGame();return}
 }
 if(o.position.z>12){scene.remove(o);objects.splice(i,1)}
 }
 camera.position.x+=(player.position.x*.16-camera.position.x)*dt*2;camera.lookAt(player.position.x*.12,1,-8);
 renderer.render(scene,camera);
}
function loop(){requestAnimationFrame(loop);let dt=Math.min(clock?clock.getDelta():0,.04);update(dt)}
document.getElementById('start').onclick=()=>{if(!renderer)init();reset()};
document.getElementById('left').ontouchstart=e=>{e.preventDefault();moveLane(-1)};document.getElementById('right').ontouchstart=e=>{e.preventDefault();moveLane(1)};document.getElementById('jump').ontouchstart=e=>{e.preventDefault();jump()};
document.getElementById('left').onclick=()=>moveLane(-1);document.getElementById('right').onclick=()=>moveLane(1);document.getElementById('jump').onclick=jump;
addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='a')moveLane(-1);if(e.key==='ArrowRight'||e.key==='d')moveLane(1);if(e.key===' '||e.key==='ArrowUp'||e.key==='w')jump()});
let sx=0,sy=0;addEventListener('touchstart',e=>{sx=e.changedTouches[0].clientX;sy=e.changedTouches[0].clientY},{passive:true});
addEventListener('touchend',e=>{let dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.abs(dx)>35)moveLane(dx>0?1:-1);else if(dy<-25)jump()},{passive:true});
addEventListener('resize',()=>{if(!renderer)return;camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
loop();
})();
</script>
</body></html>
